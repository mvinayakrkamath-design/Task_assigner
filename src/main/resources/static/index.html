<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CTAGS</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --ink:#1d2330; --muted:#677085; --line:#dde1e8;
          --accent:#2f5bea; --ok:#1d8a4e; --warn:#b26a00; --err:#c0392b; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
         background:var(--bg); color:var(--ink); }
  header { background:var(--ink); color:#fff; padding:14px 24px; display:flex;
           justify-content:space-between; align-items:center; }
  header h1 { font-size:18px; margin:0; letter-spacing:.3px; }
  main { max-width:960px; margin:24px auto; padding:0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px;
          padding:20px; margin-bottom:20px; }
  h2 { font-size:16px; margin:0 0 14px; }
  label { display:block; font-size:13px; color:var(--muted); margin:10px 0 4px; }
  input, select, textarea { width:100%; padding:9px 10px; border:1px solid var(--line);
          border-radius:6px; font:inherit; }
  button { background:var(--accent); color:#fff; border:0; border-radius:6px;
           padding:9px 16px; font:inherit; cursor:pointer; margin-top:14px; }
  button.link { background:none; color:#fff; padding:0; margin:0; text-decoration:underline; }
  button.small { padding:5px 10px; margin:0; font-size:13px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:0 16px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:9px 8px; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-weight:600; font-size:12px; text-transform:uppercase; }
  .tag { display:inline-block; padding:2px 8px; border-radius:10px; font-size:12px;
         background:#eef1f8; }
  .tag.high, .tag.critical { background:#fde8e6; color:var(--err); }
  .tag.in_progress { background:#fff3e0; color:var(--warn); }
  .tag.submitted { background:#e6f5ec; color:var(--ok); }
  .msg { font-size:14px; margin-top:10px; }
  .msg.err { color:var(--err); } .msg.ok { color:var(--ok); }
  .hidden { display:none; }
  #login { max-width:380px; margin:60px auto; }
  @media (max-width:640px) { .grid { grid-template-columns:1fr; } }
</style>
</head>
<body>
<header>
  <h1>CTAGS &middot; Corporate Task Assignment &amp; Grading</h1>
  <div id="whoami" class="hidden"><span id="who"></span> &nbsp; <button class="link" onclick="logout()">Log out</button></div>
</header>

<main>
  <!-- Login -->
  <section id="login" class="card">
    <h2>Sign in</h2>
    <label for="email">Email</label>
    <input id="email" type="email" value="manager@ctags.com">
    <label for="password">Password</label>
    <input id="password" type="password" value="Password@123">
    <button onclick="login()">Sign in</button>
    <div id="loginMsg" class="msg"></div>
  </section>

  <!-- Manager: assign task -->
  <section id="assign" class="card hidden">
    <h2>Assign a task</h2>
    <div class="grid">
      <div><label>Title</label><input id="tTitle"></div>
      <div><label>Assign to</label><select id="tAssignee"></select></div>
      <div><label>Priority</label>
        <select id="tPriority"><option>low</option><option selected>medium</option>
        <option>high</option><option>critical</option></select></div>
      <div><label>Weightage (1&ndash;5)</label><input id="tWeight" type="number" min="1" max="5" value="1"></div>
      <div><label>Deadline</label><input id="tDeadline" type="datetime-local"></div>
    </div>
    <label>Description</label><textarea id="tDesc" rows="3"></textarea>
    <button onclick="createTask()">Assign task</button>
    <div id="assignMsg" class="msg"></div>
  </section>

  <!-- Task list -->
  <section id="taskList" class="card hidden">
    <h2 id="listTitle">Tasks</h2>
    <table>
      <thead><tr><th>Title</th><th>Priority</th><th>Deadline</th><th id="personCol">Assigned to</th><th>Status</th><th></th></tr></thead>
      <tbody id="tasks"></tbody>
    </table>
  </section>
</main>

<script>
let token = sessionStorage.getItem("ctags_token");
let user = JSON.parse(sessionStorage.getItem("ctags_user") || "null");

async function api(path, options = {}) {
  const res = await fetch(path, {
    ...options,
    headers: { "Content-Type": "application/json",
               ...(token ? { Authorization: "Bearer " + token } : {}) },
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || "Request failed");
  return data;
}

function show(id, on) { document.getElementById(id).classList.toggle("hidden", !on); }
function msg(id, text, ok) { const el = document.getElementById(id); el.textContent = text; el.className = "msg " + (ok ? "ok" : "err"); }
function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

async function login() {
  try {
    const data = await api("/api/auth/login", { method: "POST", body: JSON.stringify({
      email: document.getElementById("email").value,
      password: document.getElementById("password").value }) });
    token = data.token; user = data.user;
    sessionStorage.setItem("ctags_token", token);
    sessionStorage.setItem("ctags_user", JSON.stringify(user));
    render();
  } catch (e) { msg("loginMsg", e.message); }
}

function logout() { sessionStorage.clear(); token = null; user = null; render(); }

async function render() {
  const loggedIn = !!token;
  show("login", !loggedIn); show("whoami", loggedIn); show("taskList", loggedIn);
  show("assign", loggedIn && user.role === "manager");
  if (!loggedIn) return;
  document.getElementById("who").textContent = `${user.name} (${user.role})`;
  document.getElementById("listTitle").textContent =
    user.role === "employee" ? "My tasks" : user.role === "manager" ? "Tasks I assigned" : "All tasks";
  document.getElementById("personCol").textContent = user.role === "employee" ? "Assigned by" : "Assigned to";
  if (user.role === "manager") await loadTeam();
  await loadTasks();
}

async function loadTeam() {
  const { users } = await api("/api/users");
  document.getElementById("tAssignee").innerHTML =
    users.filter(u => u.role === "employee").map(u => `<option value="${u.id}">${esc(u.name)}</option>`).join("");
}

async function loadTasks() {
  try {
    const { tasks } = await api("/api/tasks");
    const rows = tasks.map(t => {
      let action = "";
      if (user.role === "employee" && t.status === "assigned")
        action = `<button class="small" onclick="setStatus(${t.id},'in_progress')">Start</button>`;
      else if (user.role === "employee" && t.status === "in_progress")
        action = `<button class="small" onclick="setStatus(${t.id},'submitted')">Submit</button>`;
      const person = user.role === "employee" ? t.assigned_by_name : t.assigned_to_name;
      return `<tr><td>${esc(t.title)}</td><td><span class="tag ${t.priority}">${t.priority}</span></td>
        <td>${esc(t.deadline.replace("T", " "))}</td><td>${esc(person)}</td>
        <td><span class="tag ${t.status}">${t.status.replace("_", " ")}</span></td><td>${action}</td></tr>`;
    }).join("");
    document.getElementById("tasks").innerHTML = rows || `<tr><td colspan="6">No tasks yet.</td></tr>`;
  } catch (e) { if (/token/i.test(e.message)) logout(); }
}

async function createTask() {
  try {
    await api("/api/tasks", { method: "POST", body: JSON.stringify({
      title: document.getElementById("tTitle").value,
      description: document.getElementById("tDesc").value,
      assigned_to: Number(document.getElementById("tAssignee").value),
      priority: document.getElementById("tPriority").value,
      weightage: Number(document.getElementById("tWeight").value),
      deadline: document.getElementById("tDeadline").value }) });
    msg("assignMsg", "Task assigned.", true);
    document.getElementById("tTitle").value = ""; document.getElementById("tDesc").value = "";
    loadTasks();
  } catch (e) { msg("assignMsg", e.message); }
}

async function setStatus(id, status) {
  try { await api(`/api/tasks/${id}/status`, { method: "PATCH", body: JSON.stringify({ status }) }); loadTasks(); }
  catch (e) { alert(e.message); }
}

render();
</script>
</body>
</html>
