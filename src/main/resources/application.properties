spring.application.name=ctags
server.port=8080

# Development database (H2 file in ./data). Use the "mysql" profile for MySQL.
spring.datasource.url=jdbc:h2:file:./data/ctags;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JSON uses snake_case (assigned_to, assigned_to_name, ...)
spring.jackson.property-naming-strategy=SNAKE_CASE

# JWT: secret must be at least 32 characters. Override in production.
ctags.jwt.secret=${CTAGS_JWT_SECRET:change-this-secret-key-in-production-1234}
ctags.jwt.expiry-hours=8

# Create demo users on first start
ctags.seed=true
